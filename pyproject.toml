[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amase-scheduling"
dynamic = ["version"]
description = "AMASE-P telescope observation scheduler — MILP-based optimal scheduling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Cheng Zhuo", email = "chengzphy@gmail.com"}
]
keywords = ["astronomy", "scheduling", "telescope", "MILP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.20",
    "astropy>=5.0",
    "astroplan>=0.10",
    "pulp[cbc]>=3.1",
    "pandas>=1.3",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
web = ["fastapi", "uvicorn[standard]"]

[project.scripts]
amase-schedule = "amase_scheduling.cli:main"
amase-precompute = "amase_scheduling.cli_precompute:main"
amase-plot = "amase_scheduling.cli_plot:main"
amase-web = "amase_scheduling.web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"amase_scheduling" = ["web/static/*", "web/data/*.csv"]

[tool.setuptools.dynamic]
version = {attr = "amase_scheduling.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
